<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bee Pixel Puzzle</title>
<style>
  :root{
    --bg1:#fbc27a; --bg2:#f5a445;
    --ink:#5b3410;
    --panel:#f7e9cc; --panel-edge:#e2c18a;
    --btn:#5f86c2; --btn-edge:#3f5f96;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:repeating-conic-gradient(from 45deg,var(--bg1) 0 25%,var(--bg2) 0 50%) 0 0/120px 120px;
    display:flex;justify-content:center;
    overflow-x:hidden;
  }
  #app{width:100%;max-width:440px;padding:16px;display:flex;flex-direction:column;gap:14px}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:26px;font-weight:800;text-shadow:0 2px 0 #fff}
  .btn{
    min-width:58px;height:44px;padding:0 12px;border:0;border-radius:12px;
    background:var(--btn);box-shadow:0 4px 0 var(--btn-edge);
    color:#fff;font:800 16px/1 system-ui,sans-serif;cursor:pointer;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
  .btn.wide{width:100%;height:52px;font-size:19px}
  .btn.light{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9c39a}

  .panel{
    background:var(--panel);border:6px solid var(--panel-edge);border-radius:18px;
    padding:12px;position:relative;
  }
  #picture{
    display:block;width:100%;height:auto;image-rendering:pixelated;
    border-radius:6px;
  }
  .stats{text-align:center;font-weight:700;font-size:15px;opacity:.8;margin:-4px 0 0}

  .bee{
    position:absolute;font-size:24px;pointer-events:none;user-select:none;
    animation:buzz calc(2.4s * var(--k,1)) ease-in-out infinite alternate;
  }
  @keyframes buzz{
    from{transform:translate(0,0) rotate(-8deg)}
    to{transform:translate(var(--bx),var(--by)) rotate(8deg)}
  }
  body.fast{--k:.5}
  body.paused .bee{animation-play-state:paused}

  #board{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;
  }
  .col{display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
  .tile{
    height:52px;border:0;border-radius:12px;padding:0;
    font:900 22px/1 system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),0 3px 0 rgba(0,0,0,.22);
    cursor:default;
  }
  .tile.free{cursor:pointer}
  .tile.free:hover{filter:brightness(1.08)}
  .tile.free:active{transform:translateY(2px)}
  .tile:disabled{opacity:.92}
  .hint{text-align:center;font-size:14px;opacity:.75;margin:0}

  .fly{position:fixed;font-size:32px;pointer-events:none;z-index:10}

  #overlay{
    position:fixed;inset:0;background:rgba(60,35,10,.45);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;
  }
  #overlay[hidden]{display:none}
  .card{
    background:var(--panel);border:6px solid var(--panel-edge);border-radius:20px;
    padding:24px;width:100%;max-width:320px;text-align:center;
  }
  .card h2{margin:0 0 8px;font-size:26px}
  .card p{margin:0 0 18px;font-size:16px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="btn" id="pause" aria-label="Pause">❚❚</button>
    <h1 id="level">Level 200</h1>
    <button class="btn" id="speed" aria-label="Animation speed">» 2x</button>
  </header>

  <div class="panel" id="stage">
    <canvas id="picture" width="400" height="160" aria-label="Pixel picture"></canvas>
  </div>
  <p class="stats" id="stats"></p>

  <div class="panel">
    <div id="board"></div>
  </div>
  <p class="hint">Tap a block at the bottom of a column to paint its pixels.</p>
</div>

<div id="overlay" hidden>
  <div class="card">
    <h2 id="ov-title"></h2>
    <p id="ov-text"></p>
    <button class="btn wide" id="ov-btn"></button>
  </div>
</div>

<script>
(() => {
  const COLS = 5, W = 40, H = 16;
  const COLORS = {
    dark:'#2b2b2b', white:'#f4f4f2', gray:'#b9b9b9', yellow:'#f6cf1f',
    red:'#e2352b', green:'#35b84b', blue:'#2f63dc', orange:'#f1891e', olive:'#9d9a6a'
  };
  const LIGHT_TILES = new Set(['white','yellow','gray']);
  const BEE_COUNT = 10;

  const $ = s => document.querySelector(s);
  const canvas = $('#picture'), ctx = canvas.getContext('2d');
  const board = $('#board'), overlay = $('#overlay');
  let S = null;
  let fast = false;

  // Pixel-art NES-style controller. Returns a COLORS key, or null for transparent.
  function pictureColor(x, y) {
    if (x < 0 || x > W - 1 || y < 1 || y > 14) return null;
    const rim = x === 0 || x === W - 1 || y === 1 || y === 14;
    if (rim) {
      if ((x === 0 || x === W - 1) && (y === 1 || y === 14)) return null;
      return y === 14 ? 'gray' : 'white';
    }
    const dx = x - 9, dy = y - 8;
    if ((Math.abs(dx) <= 1 && Math.abs(dy) <= 4) || (Math.abs(dy) <= 1 && Math.abs(dx) <= 4)) {
      if (dx === 0 || dy === 0) return 'dark';
      if (dx < 0) return dy < 0 ? 'yellow' : 'green';
      return dy < 0 ? 'blue' : 'red';
    }
    if (x >= 16 && x <= 23 && y >= 4 && y <= 6) return y === 5 ? 'red' : 'olive';
    if (x >= 16 && x <= 23 && y >= 9 && y <= 11 && (y === 9 || y === 11 || x === 16 || x === 23)) return 'white';
    const circles = [[32, 5, 'blue'], [28, 8, 'green'], [36, 8, 'red'], [28, 11, 'orange'], [36, 11, 'yellow']];
    for (const [cx, cy, c] of circles) {
      if ((x - cx) ** 2 + (y - cy) ** 2 <= 4.5) return c;
    }
    return 'dark';
  }

  function mulberry32(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Each tile owns a fixed set of picture cells of its color, so any tap order completes the level.
  function buildLevel(level) {
    const rng = mulberry32(level * 7919 + 17);
    const pic = new Array(W * H).fill(null);
    const byColor = {};
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const c = pictureColor(x, y);
        pic[y * W + x] = c;
        if (c) (byColor[c] ||= []).push(y * W + x);
      }
    }
    const tiles = [];
    for (const color of Object.keys(byColor)) {
      const list = shuffle(byColor[color], rng);
      for (let i = 0; i < list.length;) {
        const n = Math.min(list.length - i, 6 + Math.floor(rng() * 9));
        tiles.push({ color, n, cells: list.slice(i, i + n) });
        i += n;
      }
    }
    shuffle(tiles, rng);
    const cols = Array.from({ length: COLS }, () => []);
    tiles.forEach((t, i) => cols[i % COLS].push(t)); // index 0 is the bottom tile
    const total = pic.filter(Boolean).length;
    return { level, pic, revealed: new Array(W * H).fill(false), total, done: 0, cols, moves: 0, paused: false, won: false };
  }

  function drawPicture() {
    const cs = 10;
    canvas.width = W * cs;
    canvas.height = H * cs;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x, c = S.pic[i];
        ctx.fillStyle = c
          ? (S.revealed[i] ? COLORS[c] : ((x + y) % 2 ? '#d6c196' : '#cdb78c'))
          : '#f3e6cb';
        ctx.fillRect(x * cs, y * cs, cs, cs);
      }
    }
  }

  function render() {
    board.innerHTML = '';
    S.cols.forEach((col, c) => {
      const el = document.createElement('div');
      el.className = 'col';
      for (let i = col.length - 1; i >= 0; i--) {
        const t = col[i];
        const b = document.createElement('button');
        const free = i === 0;
        b.className = 'tile' + (free ? ' free' : '');
        b.style.background = COLORS[t.color];
        b.style.color = LIGHT_TILES.has(t.color) ? '#3a2410' : '#fff';
        b.style.textShadow = LIGHT_TILES.has(t.color) ? 'none' : '';
        b.textContent = t.n;
        b.dataset.col = c;
        b.disabled = !free;
        el.appendChild(b);
      }
      board.appendChild(el);
    });
    drawPicture();
    $('#stats').textContent = `Moves ${S.moves} · ${Math.round(S.done / S.total * 100)}%`;
  }

  function flyBee(from, to) {
    const b = document.createElement('div');
    b.className = 'fly';
    b.textContent = '🐝';
    const fx = from.left + from.width / 2, fy = from.top + from.height / 2;
    const tx = to.left + to.width / 2, ty = to.top + to.height / 2;
    b.style.left = (fx - 16) + 'px';
    b.style.top = (fy - 16) + 'px';
    document.body.appendChild(b);
    b.animate(
      [{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${tx - fx}px,${ty - fy}px) scale(.5)` }],
      { duration: fast ? 300 : 600, easing: 'cubic-bezier(.5,0,.8,.6)', fill: 'forwards' }
    ).onfinish = () => b.remove();
  }

  function tap(col, el) {
    if (S.paused || S.won) return;
    const t = S.cols[col][0];
    if (!t) return;
    flyBee(el.getBoundingClientRect(), canvas.getBoundingClientRect());
    for (const i of t.cells) S.revealed[i] = true;
    S.done += t.cells.length;
    S.cols[col].shift();
    S.moves++;
    render();
    if (S.done === S.total) {
      S.won = true;
      setTimeout(() => showOverlay('win'), 700);
    }
  }

  function showOverlay(kind) {
    overlay.hidden = false;
    const win = kind === 'win';
    $('#ov-title').textContent = win ? 'Level complete!' : 'Paused';
    $('#ov-text').textContent = win ? `Cleared in ${S.moves} moves` : 'The bees are waiting for you.';
    $('#ov-btn').textContent = win ? 'Next level' : 'Resume';
  }

  function togglePause() {
    if (S.won) return;
    S.paused = !S.paused;
    document.body.classList.toggle('paused', S.paused);
    if (S.paused) showOverlay('pause');
    else overlay.hidden = true;
  }

  function spawnBees() {
    const rng = mulberry32(42);
    const stage = $('#stage');
    for (let i = 0; i < BEE_COUNT; i++) {
      const bee = document.createElement('div');
      bee.className = 'bee';
      bee.textContent = '🐝';
      bee.style.left = (rng() * 85 + 2) + '%';
      bee.style.top = (rng() * 80 + 2) + '%';
      bee.style.setProperty('--bx', (rng() * 36 - 18) + 'px');
      bee.style.setProperty('--by', (rng() * 30 - 15) + 'px');
      bee.style.animationDelay = (-rng() * 2.4) + 's';
      stage.appendChild(bee);
    }
  }

  board.addEventListener('click', e => {
    const b = e.target.closest('button.free');
    if (b) tap(Number(b.dataset.col), b);
  });

  $('#pause').addEventListener('click', togglePause);
  $('#speed').addEventListener('click', () => {
    fast = !fast;
    document.body.classList.toggle('fast', fast);
    $('#speed').textContent = fast ? '» 2x' : '» 1x';
  });
  $('#ov-btn').addEventListener('click', () => {
    if (S.won) {
      S = buildLevel(S.level + 1);
      $('#level').textContent = `Level ${S.level}`;
      overlay.hidden = true;
      render();
    } else {
      togglePause();
    }
  });

  S = buildLevel(200);
  spawnBees();
  render();
})();
</script>
</body>
</html>
